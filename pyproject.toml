[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_os"
version = "0.1.0"
description = "A description of your project"
readme = "README.md"
requires-python = ">=3.8"
# Add your dependencies here, for example:
dependencies = [
    "prompt_toolkit>=3.0.0",
    "textual>=0.70.0",
    "aiohttp>=3.8.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.1.0",
    "aioresponses>=0.7.0",
]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
]



[project.scripts]
aios = "main:main"          # ← point to the main() function in main.py

[tool.setuptools]           # ← add this table if it doesn't exist
py-modules = ["main"]       # ← tells setuptools to install main.py as a module



[project.urls]
"Homepage" = "https://github.com/nbardy/ai_os" # Replace with your actual URL
"Bug Tracker" = "https://github.com/nbardy/ai_os/issues" # Replace with your actual URL

[tool.setuptools.packages.find]
where = ["."]  # search in the root directory
include = ["ai_os*"]  # include packages starting with ai_os
exclude = ["tmp*"] # exclude directories like tmp 