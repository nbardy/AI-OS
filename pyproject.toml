[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_os"
version = "2.0.0"
description = "Agentic Macro Framework - Python DSL for composable AI workflows built on Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
charts = [
    "matplotlib>=3.7.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.1.0",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]



[project.scripts]
aios = "ai_os.cli:main"

[tool.setuptools]           # ← add this table if it doesn't exist
py-modules = ["main"]       # ← tells setuptools to install main.py as a module



[project.urls]
"Homepage" = "https://github.com/nbardy/ai_os" # Replace with your actual URL
"Bug Tracker" = "https://github.com/nbardy/ai_os/issues" # Replace with your actual URL

[tool.setuptools.packages.find]
where = ["."]  # search in the root directory
include = ["ai_os*"]  # include packages starting with ai_os
exclude = ["tmp*"] # exclude directories like tmp 

[dependency-groups]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
